<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite animado con Canvas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Sprite animado con Canvas</h1>

  <!-- El lienzo donde JavaScript dibuja el fondo y el personaje -->
  <canvas id="escenario" width="640" height="400">
    Tu navegador no soporta Canvas.
  </canvas>

  <p class="instrucciones">
    Mueve al robot con <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd>
    o con <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
  </p>

  <script src="js/game.js"></script>
</body>
</html>
